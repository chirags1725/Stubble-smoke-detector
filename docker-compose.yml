services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: stubble-dynamodb
    working_dir: /home/dynamodblocal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /home/dynamodblocal/data && exec java -Djava.library.path=./DynamoDBLocal_lib -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      stubble-local:
        aliases:
          - dynamodb-local

volumes:
  dynamodb-data:

networks:
  stubble-local:
    name: stubble-local
